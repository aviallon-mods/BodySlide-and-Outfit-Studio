# FOMOD package spec for BodySlide and Outfit Studio (schema:
# aviallon-mods/modforge tools/package_fomod.py docstring). One [[files]] entry
# per zip entry: the zip contains exactly this list + meta.ini at its root,
# nothing else.
#
# `stage/` is produced by tools/fomod-stage.sh from tools/fomod-build.sh's
# output (BodySlide.exe / OutfitStudio.exe built with the repo's documented
# CMake build) plus the repo's res/, lang/ and root XML config - i.e. the same
# payload and layout as the windows-x64-relwithdebinfo package, minus the
# empty data directories (a zip of files cannot carry them).
#
# The staging script refuses to run when the staged tree carries a file this
# spec does not claim, so a file added to res/ or lang/ turns the packaging run
# red instead of silently missing from the zip.

name = "BodySlide-and-Outfit-Studio"
zip_name = "BodySlide-and-Outfit-Studio-{version}-fomod.zip"
# Single source of truth for the version: the git tags, resolved exactly like
# .github/appimage/make-appimage.sh does (`git describe --tags`, leading v
# stripped). Written to fomod-version.txt by tools/fomod-stage.sh.
version = { file = "fomod-version.txt" }
game_name = "site"
author = "ousnius and Caliente"
description = "BodySlide and Outfit Studio, a tool to convert, create, and customize outfits and bodies for The Elder Scrolls, Fallout and Starfield."
nexus_name = "BodySlide and Outfit Studio"
nexus_url = "https://github.com/aviallon-mods/BodySlide-and-Outfit-Studio"
file_category = "MAIN"
# A standalone tool: no mod requirements.
requirements = []
fomod = true


